# Leasorix bootstrap configuration.
#
# Every key can be overridden by an environment variable:
#   LEASORIX_<SECTION>_<KEY>, e.g. LEASORIX_HTTP_LISTEN=10.0.0.5:8067
# Scopes, reservations and options are NOT configured here; they live in the
# database and are managed through the web UI / REST API.

# Directory for the SQLite database, certificates and other state.
data_dir: /var/lib/leasorix

log:
  # debug | info | warn | error
  level: info
  # json | text
  format: json

http:
  # Management listener for UI, REST API, /healthz, /readyz and /metrics.
  # Keep it on localhost or a dedicated management interface.
  listen: 127.0.0.1:8067
  shutdown_timeout: 10s

dhcp4:
  # Interfaces to serve (one socket per interface, SO_BINDTODEVICE).
  # Relayed requests must arrive on one of these interfaces as well.
  # Empty list = DHCPv4 disabled.
  interfaces: [eth0]
  # Max. packets processed concurrently.
  workers: 256
  # How long an offered address is held for the client's REQUEST.
  offer_timeout: 60s
  # How long declined / conflicting addresses stay blocked.
  decline_time: 24h
  # How long expired/released leases are kept so the client gets its
  # previous address back (Windows: 4h).
  expired_grace: 4h
  expiry_interval: 10s
  # Ping an address before offering it (needs CAP_NET_RAW or
  # net.ipv4.ping_group_range).
  conflict_detection:
    enabled: true
    timeout: 500ms
    attempts: 1

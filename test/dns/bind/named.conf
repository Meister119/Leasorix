// BIND configuration of the DNS integration test.
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
};

// Test-only key, also in test/dns/pdns/init.sh and the Go test.
key "leasorix-key" {
    algorithm hmac-sha256;
    secret "bGVhc29yaXgtaW50ZWdyYXRpb24tdGVzdC1rZXktMDE=";
};

zone "bind.test" {
    type primary;
    file "/var/lib/bind/bind.test.zone";
    update-policy { grant leasorix-key zonesub ANY; };
};

zone "77.10.in-addr.arpa" {
    type primary;
    file "/var/lib/bind/77.10.in-addr.arpa.zone";
    update-policy { grant leasorix-key zonesub ANY; };
};

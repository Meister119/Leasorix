name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: test
        run: make test
      - name: build
        run: make build
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install DHCP clients and relay
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2 isc-dhcp-client udhcpc dnsmasq-base
      - name: netns integration tests
        run: sudo -E env "PATH=$PATH" make test-integration
